name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: Validate without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish harpist to npm
    runs-on: ubuntu-latest
    environment: npm
    if: github.repository == 'kenobi-ai/harpist' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "${HOME}/.bun/bin" >> "$GITHUB_PATH"
          "${HOME}/.bun/bin/bun" --version

      - name: Upgrade npm
        run: npm install --global npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          expected_tag="v${package_version}"
          release_tag="${{ github.event.release.tag_name }}"
          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "Release tag ${release_tag} does not match package version ${package_version}."
            echo "Expected ${expected_tag}."
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Inspect package
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/harpist-package"
          mkdir -p "${package_dir}"
          NPM_CONFIG_CACHE=/tmp/harpist-npm-cache npm pack --workspace harpist --pack-destination "${package_dir}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          package_file="${package_dir}/harpist-${package_version}.tgz"
          tar -xOf "${package_file}" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => {
              input += chunk;
            });
            process.stdin.on("end", () => {
              const packageJson = JSON.parse(input);
              const fields = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
              const catalogSpecs = fields.flatMap((field) =>
                Object.entries(packageJson[field] ?? {})
                  .filter(([, spec]) => spec === "catalog:")
                  .map(([name]) => `${field}.${name}`),
              );
              if (catalogSpecs.length > 0) {
                console.error(`Packed package contains unresolved catalog specs: ${catalogSpecs.join(", ")}`);
                process.exit(1);
              }
            });
          '

      - name: Resolve npm tag
        id: npm-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.npm_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --workspace harpist --tag "${{ steps.npm-tag.outputs.tag }}"

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish --workspace harpist --tag "${{ steps.npm-tag.outputs.tag }}"
